<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Services — ARIES GROUP</title>
  <meta name="description" content="End-to-end influencer marketing and talent management: talent sourcing and development, campaign management, brand ambassadorship and partnership deals.">
  <meta name="theme-color" content="#070707">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/icons/logo-mark.svg" type="image/svg+xml">

  <link rel="preload" href="assets/fonts/Aventa-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Aventa-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/img/services-hero.webp" as="image" media="(min-width: 1024px)">
  <link rel="preload" href="assets/img/services-hero-m.webp" as="image" media="(max-width: 1023px)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&amp;display=swap">

  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('js-anim');
      setTimeout(function () { if (!window.gsap) document.documentElement.classList.remove('js-anim'); }, 4000);
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/services.css">

  <script src="js/components.js"></script>
</head>
<body class="page page-services">

  <div data-component="header" data-active="services"></div>
  <script>AriesUI.mount()</script>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="hero hero--services" aria-labelledby="services-title">
      <div class="hero__art" aria-hidden="true">
        <div class="hero__art-inner srv-hero__art">
          <picture class="hero__picture" data-parallax="-6">
            <source media="(max-width: 1023px)" srcset="assets/img/services-hero-m.webp" width="390" height="436">
            <img class="hero__art-img" src="assets/img/services-hero.webp" width="900" height="683" alt="" fetchpriority="high">
          </picture>
        </div>
        <img class="hero__beam hero__beam--1" src="assets/icons/hero-beam-1.svg" width="739" height="1165" alt="">
        <img class="hero__beam hero__beam--2" src="assets/icons/hero-beam-2.svg" width="855" height="1095" alt="">
        <img class="hero__beam hero__beam--3" src="assets/icons/hero-beam-3.svg" width="833" height="1287" alt="">
      </div>

      <div class="hero__content srv-hero__content container">
        <p class="label srv-hero__label" data-reveal><span>[</span><span class="label__text">Our Services</span><span>]</span></p>
        <h1 class="srv-hero__title gradient-text" id="services-title" style="--grad: var(--grad-title-x)" data-split>End-to-End Influencer Marketing &amp; Talent Management.</h1>
        <p class="text srv-hero__text" data-reveal>From sourcing and negotiations to campaign delivery and long-term partnerships, ARIES handles the commercial and operational side of influencer collaborations.</p>
      </div>
    </section>

    <!-- ============ WHAT WE DO (component) ============ -->
    <div data-component="what-we-do" data-btn-text="Contact us" data-btn-href="contact.html#contact-form"></div>
    <script>AriesUI.mount()</script>

    <!-- ============ CTA WITH PHONE (component) ============ -->
    <section class="cta-phone cta-phone--compact section" id="lets-talk" aria-labelledby="cta-title">
      <div data-component="cta-phone-art"></div>
      <script>AriesUI.mount()</script>

      <div class="cta-phone__content container">
        <h2 class="title cta-phone__title cta-phone__title--wide gradient-text" id="cta-title" data-split>Ready to Build Your Next Campaign?</h2>
        <a class="btn btn--light cta-phone__btn" href="contact.html#contact-form" data-reveal>
          <span class="btn__text">Contact ARIES</span>
          <span class="btn__icon"><img src="assets/icons/arrow.svg" width="10" height="10" alt=""></span>
        </a>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>
  <script>AriesUI.mount()</script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/sections.js" defer></script>
</body>
</html>
